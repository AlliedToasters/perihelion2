# Perihelion v2 tech tree, specialty overlay 0.2 (2026-10-26). Generated from techtree.yaml 0.1 plus:
#   - the day-one tier (share_audit, solver_audit, timing_side_channel, continuous_tracking, thermal_watch,
#     verified_exchange) priced at 30-60% of a station-day so cost, not min_hours, decides what a station can
#     finish, and a 0.5 affinity saves half a day;
#   - seven specialty nodes, one per inhabited station, startable only with that station's instrument
#     (scenario `hardware`); each makes a deep node cheaper for any station holding its artifact.
# First live games (SPEC section 20 item 25) showed every station finishing the same six nodes because the whole
# day-one tier cost under 4% of a day's power. Everything else is unchanged from techtree.yaml.
# Units: compute in GWh, time in hours. Reference: one station-day at full rating = 212 GW x 24 h = 5,088 GWh.
meta:
  version: 0.2.0-specialty
  station_day_gwh: 5088
  hashrate_per_station_hs: 3.8e+18
  hash_per_joule: 18000000.0
nodes:
- id: opt.solver_audit
