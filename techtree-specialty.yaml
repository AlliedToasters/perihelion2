  cost_model: assumed
  true_cost_draw:
    median: 2500
    sigma: 0.3
  affinity:
    P3: 0.6
    P5: 0.8
  lock: none
  discovery: visible
  effects:
  - reveal:
    - opt.aux_optimizer
    - opt.hash_efficiency
